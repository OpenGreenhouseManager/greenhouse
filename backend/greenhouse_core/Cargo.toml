[package]
name = "greenhouse_core"
version = "0.2.0"
edition = "2024"
description = "greenhouse_core"
license = "GPL-3.0"

[features]
default = [
    "api_web_dto",
    "api_script_dto",
    "auth_service_dto",
    "smart_device_dto",
    "smart_device_interface",
    "data_storage_service_dto",
    "device_service_dto",
    "error_handling",
]
api_web_dto = []
api_script_dto = []
auth = [
    "service_client",
    "auth_service_dto",
    "device_service_dto",
    "dep:jsonwebtoken",
    "dep:tower-cookies",
]
auth_service_dto = []
smart_device_dto = []
smart_device_interface = ["smart_device_dto", "dep:axum", "dep:tracing", "dep:reqwest"]
data_storage_service_dto = []
device_service_dto = []
error_handling = ["dep:axum", "dep:tracing"]
service_client = ["error_handling", "dep:reqwest", "dep:urlencoding"]
ts = ["dep:ts-rs"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
greenhouse_macro = { version = "0.1", path = "../greenhouse_macro" }
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-cookies = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
uuid = { workspace = true, features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

[dev-dependencies]
httpc-test = "0.1.10"
tokio = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
