[package]
name = "greenhouse_core"
version = "0.2.0"
edition = "2024"
description = "greenhouse_core"
license = "GPL-3.0"

[features]
default = [
    "std",
    "axum",
    "api_web_dto",
    "api_script_dto",
    "auth_service_dto",
    "smart_device_dto",
    "smart_device_interface",
    "data_storage_service_dto",
    "device_service_dto",
    "error_handling",
    "scripting_service_dto",
]
# Without `std` the DTO modules build as `no_std` + `alloc` (used by greenhouse_esp32).
std = [
    "chrono/std",
    "serde/std",
    "serde_json?/std",
    "uuid/std",
    "uuid/v4",
    "uuid/fast-rng",
    "uuid/macro-diagnostics",
]
# axum integration (`IntoResponse` impls on DTOs). Off for embedded consumers.
axum = ["std", "dep:axum", "greenhouse_macro/axum"]
api_web_dto = []
api_script_dto = []
auth_service_dto = ["dep:serde_json"]
smart_device_dto = []
# Runtime-agnostic device types and logic (no_std); shared with greenhouse_esp32.
smart_device_common = ["smart_device_dto", "data_storage_service_dto", "dep:serde_json"]
smart_device_interface = ["smart_device_common", "axum", "dep:futures", "dep:tracing", "dep:reqwest"]
data_storage_service_dto = []
device_service_dto = ["std", "dep:serde_json"] # backend-only; uses HashMap and std::error
error_handling = ["axum", "dep:serde_json", "dep:tracing"]
scripting_service_dto = []
ts = ["std", "dep:ts-rs"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# chrono/serde/serde_json/uuid are declared here rather than via the workspace so
# their default (std) features can be switched off for no_std builds.
[dependencies]
axum = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
futures = { workspace = true, optional = true }
greenhouse_macro = { version = "0.1", path = "../greenhouse_macro", default-features = false }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"], optional = true }
tracing = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }
uuid = { version = "1.28.0", default-features = false, features = ["serde"] }

[dev-dependencies]
httpc-test = "0.1.10"
