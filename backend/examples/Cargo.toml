[package]
name = "examples"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
greenhouse_core = { path = "../greenhouse_core" }
greenhouse_device = { path = "../greenhouse_device" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[[example]]
name = "input_output_int_saver"
path = "input_output_int_saver.rs"
[[example]]
name = "input_alert_trigger"
path = "input_alert_trigger.rs"
[[example]]
name = "periodic_alert"
path = "periodic_alert.rs"
