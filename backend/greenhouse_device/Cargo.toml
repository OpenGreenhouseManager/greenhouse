[package]
name = "greenhouse_device"
version = "0.1.0"
edition = "2024"
description = "Building blocks for OpenGreenhouseManager smart devices: axum/tokio on hosts, esp-hal/embassy on the ESP32-C3"
license = "GPL-3.0"
publish = false

# The runtime is picked by the build target, not by a feature, so
# `--workspace --all-features` on a host never pulls in the ESP32 crates:
#   - host targets: axum + tokio + reqwest, config in a JSON file
#   - `target_os = "none"` (riscv32imc-unknown-none-elf, ESP32-C3): esp-hal + embassy
#     + picoserve + mbedtls, config in the `nvs` flash partition.
# Examples: `examples/esp32_*.rs` are firmware (build them with the `esp32-*`
# cargo aliases in backend/.cargo/config.toml), all others run on the host.

[dependencies]
greenhouse_core = { path = "../greenhouse_core", default-features = false, features = ["data_storage_service_dto", "smart_device_dto"] }
log = "0.4"
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
axum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }

[target.'cfg(target_os = "none")'.dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "log-04", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32c3", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32c3"] }
mbedtls-rs = { version = "0.3.0", features = ["esp32c3"] }
picoserve = { version = "0.20.1", features = ["alloc", "embassy", "log"] }
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }
static_cell = "2.1.0"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
rand = "0.10.3"
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_os = "none")'.dev-dependencies]
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
