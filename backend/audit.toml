# RUSTSEC-2023-0071: rsa Marvin attack (timing side channel on RSA decryption)
#
# Pulled in unconditionally by jsonwebtoken's `rust_crypto` backend. This
# workspace signs and verifies JWTs with HS256 only; no RSA keys exist and no
# RSA code path is reachable. No patched rsa release is available.
#
# RUSTSEC-2026-0387: crypto-bigint timing variability
#
# crypto-bigint 0.5 is pulled in by the same backend via p256/p384 →
# elliptic-curve 0.13 (ECDSA). Only HS256 is used, so no ECDSA code path is
# reachable. The fix is only in crypto-bigint >=0.7.6, which elliptic-curve
# 0.13 cannot use.
[advisories]
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
]
