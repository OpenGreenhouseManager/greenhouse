[build]
# ESP32-C3. Tier-2 target: rustup/nix ship a prebuilt core + alloc, so stable
# Rust works without build-std.
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  # Needed by esp-backtrace for useful backtraces.
  "-C", "force-frame-pointers",
]

[env]
ESP_LOG = "info"
