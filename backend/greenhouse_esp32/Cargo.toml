[package]
name = "greenhouse_esp32"
version = "0.1.0"
edition = "2024"
description = "ESP32 smart device interface for OpenGreenhouseManager (esp-hal + embassy, no_std)"
license = "GPL-3.0"
publish = false

[lib]
name = "greenhouse_esp32"
test = false
bench = false

[[example]]
name = "input_output_int_saver"
path = "src/examples/input_output_int_saver.rs"

[dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "log-04", "unstable"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "log-04", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp-radio", "esp32c3", "log-04"] }
esp-storage = { version = "0.10.0", features = ["esp32c3"] }
greenhouse_core = { path = "../greenhouse_core", default-features = false, features = [
    "data_storage_service_dto",
    "smart_device_dto",
] }
log = "0.4"
mbedtls-rs = { version = "0.3.0", features = ["esp32c3"] }
picoserve = { version = "0.20.1", features = ["alloc", "embassy", "log"] }
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
static_cell = "2.1.0"

[dev-dependencies]
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }

[profile.dev]
# Unoptimized embassy + Wi-Fi code is too slow / too large to be useful.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
