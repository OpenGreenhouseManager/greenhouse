<grn-card [title]="header()">
  <div class="compass center">
    @if (error()) {
      <div class="error">{{ error() }}</div>
    } @else {
      <div class="dial">
        <svg
          class="dial-svg"
          viewBox="0 0 100 100"
          preserveAspectRatio="xMidYMid meet">
          <!-- Dial background and ring -->
          <circle
            cx="50"
            cy="50"
            r="48"
            fill="white"
            stroke="black"
            stroke-width="2"></circle>
          <!-- Cardinal tick marks -->
          <g stroke="currentColor" stroke-width="1.5">
            <line x1="50" y1="4" x2="50" y2="12"></line>
            <line x1="96" y1="50" x2="88" y2="50"></line>
            <line x1="50" y1="96" x2="50" y2="88"></line>
            <line x1="4" y1="50" x2="12" y2="50"></line>
          </g>
          <!-- Cardinal labels -->
          <g
            fill="currentColor"
            font-size="8"
            font-weight="700"
            text-anchor="middle"
            dominant-baseline="middle">
            <text x="50" y="14">N</text>
            <text x="86" y="52">E</text>
            <text x="50" y="90">S</text>
            <text x="14" y="52">W</text>
          </g>
          <!-- Triangular needle -->
          <g [attr.transform]="svgRotation()">
            <polygon points="50,12 58,54 42,54" fill="red"></polygon>
            <circle cx="50" cy="50" r="2.5" fill="black" opacity="0.6"></circle>
          </g>
        </svg>
      </div>
      <div class="label">{{ cardinal() }}</div>
    }
  </div>
</grn-card>
