<main class="register">
  <grn-card title="Register" class="card">
    <div class="container">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" pInputText [(ngModel)]="username" />
      </div>
      <div class="form-group">
        <label for="otp">One time password</label>
        <input id="otp" type="text" pInputText [(ngModel)]="otp" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <p-iconfield iconPosition="right">
          <input
            id="password"
            pInputPassword
            fluid
            aria-describedby="password-hint"
            [(mask)]="passwordMasked"
            [(ngModel)]="password" />
          <p-inputicon
            class="cursor-pointer"
            [class]="passwordMasked() ? 'pi pi-eye' : 'pi pi-eye-slash'"
            role="button"
            tabindex="0"
            [attr.aria-label]="
              passwordMasked() ? 'Show password' : 'Hide password'
            "
            (click)="passwordMasked.set(!passwordMasked())"
            (keydown.enter)="passwordMasked.set(!passwordMasked())" />
        </p-iconfield>
        <small id="password-hint">
          At least 8 characters, including a number and one of !@#$%^&amp;*.
          Only letters (a–z, A–Z), digits and those symbols are allowed.
        </small>
      </div>
      <div class="form-group">
        <label for="passwordRepeat">Repeat password</label>
        <p-iconfield iconPosition="right">
          <input
            id="passwordRepeat"
            pInputPassword
            fluid
            [(mask)]="passwordRepeatMasked"
            [(ngModel)]="passwordRepeat" />
          <p-inputicon
            class="cursor-pointer"
            [class]="passwordRepeatMasked() ? 'pi pi-eye' : 'pi pi-eye-slash'"
            role="button"
            tabindex="0"
            [attr.aria-label]="
              passwordRepeatMasked() ? 'Show password' : 'Hide password'
            "
            (click)="passwordRepeatMasked.set(!passwordRepeatMasked())"
            (keydown.enter)="
              passwordRepeatMasked.set(!passwordRepeatMasked())
            " />
        </p-iconfield>
      </div>
      @if (passwordError()) {
        <div class="form-group">
          <span class="login-failed" role="alert">Passwords do not match</span>
        </div>
      }
      @if (error()) {
        <div class="form-group">
          <span class="login-failed" role="alert">Username already exists</span>
        </div>
      }
      <div class="form-group">
        <button pButton type="button" text (click)="navLogin()">
          Login instead
        </button>
      </div>
      <div class="form-group register-button">
        <button pButton type="button" (click)="register()">Register</button>
      </div>
    </div>
  </grn-card>
</main>
