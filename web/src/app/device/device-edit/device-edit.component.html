<grn-nav-bar />
<main class="page">
  <div class="page-heading">
    <div class="heading-left">
      <button pButton type="button" text iconOnly (click)="goBack()">
        <i class="pi pi-arrow-left"></i>
      </button>
      @if (edit()) {
        <h1>Edit Device</h1>
      } @else {
        <h1>Add Device</h1>
      }
    </div>
  </div>
  <div class="outer-container">
    <div class="content-width">
      <grn-card title="Edit" class="card">
        <div class="content">
          <div class="container-width-restriction">
            <div class="container">
              <div class="editGroup">
                <label for="Name">Name</label>
                <input
                  pInputText
                  type="text"
                  id="Name"
                  [formField]="deviceForm.name" />
              </div>
              <div class="editGroup">
                <label for="Description">Description</label>
                <textarea
                  pTextarea
                  [autoResize]="true"
                  id="Description"
                  [formField]="deviceForm.description"></textarea>
              </div>
              <div class="editGroup">
                <label for="Address">Address</label>
                <input
                  pInputText
                  type="text"
                  id="Address"
                  [formField]="deviceForm.address" />
              </div>
              <div class="editGroup">
                <label for="CanScript">Can Script</label>
                <p-checkbox
                  id="CanScript"
                  [formField]="deviceForm.can_script"
                  [binary]="true"
                  inputId="CanScript" />
              </div>
              <div class="editGroup">
                <label for="scraping">scraping</label>
                <p-checkbox
                  id="scraping"
                  [formField]="deviceForm.scraping"
                  [binary]="true"
                  inputId="scraping" />
              </div>
            </div>
          </div>
        </div>
      </grn-card>
      <div class="actions">
        @if (edit()) {
          <button
            pButton
            type="button"
            severity="danger"
            (click)="openDeleteDialog()">
            <i class="pi pi-trash"></i><span class="button_label">Delete</span>
          </button>
        }
        <button pButton type="button" (click)="saveDevice()">
          <i class="pi pi-save"></i><span class="button_label">Save</span>
        </button>
      </div>
    </div>
  </div>
  <p-dialog
    header="Delete Device"
    [modal]="true"
    [visible]="deleteDialogVisible()"
    [dismissableMask]="true"
    [closeOnEscape]="true"
    (onHide)="closeDeleteDialog()">
    <div class="delete-dialog">
      <p>
        This permanently deletes the device. To confirm, type
        <strong class="device-name">{{ deviceName() }}</strong> below.
      </p>
      @if (deleteError()) {
        <p-message severity="error">{{ deleteError() }}</p-message>
      }
      <input
        pInputText
        type="text"
        aria-label="Device name"
        autocomplete="off"
        [value]="deleteConfirmation()"
        (input)="deleteConfirmation.set($any($event.target).value)" />
      <div class="dialog-actions">
        <button
          pButton
          type="button"
          severity="secondary"
          (click)="closeDeleteDialog()">
          Cancel
        </button>
        <button
          pButton
          type="button"
          severity="danger"
          [disabled]="!deleteConfirmed() || deleteLoading()"
          (click)="deleteDevice()">
          <i
            [class]="
              deleteLoading() ? 'pi pi-spin pi-spinner' : 'pi pi-trash'
            "></i
          >Delete
        </button>
      </div>
    </div>
  </p-dialog>
</main>
