<grn-nav-bar />
<main class="page">
  <div class="page-heading"><h1>Settings</h1></div>
  <div class="content">
    <div class="content_left">
      <div
        class="list_item"
        [class.selected]="currentTab === settingsTabs.Dashboard"
        role="button"
        tabindex="0"
        (click)="changeTab(settingsTabs.Dashboard)"
        (keydown.enter)="changeTab(settingsTabs.Dashboard)">
        <span class="text">Dashboard</span>
        <span class="icon"><i class="pi pi-chevron-right"></i></span>
      </div>
      <div
        class="list_item"
        [class.selected]="currentTab === settingsTabs.Watchdog"
        role="button"
        tabindex="0"
        (click)="changeTab(settingsTabs.Watchdog)"
        (keydown.enter)="changeTab(settingsTabs.Watchdog)">
        <span class="text">Watchdog</span>
        <span class="icon"><i class="pi pi-chevron-right"></i></span>
      </div>
      <div
        class="list_item"
        [class.selected]="currentTab === settingsTabs.AdminSettings"
        role="button"
        tabindex="0"
        (click)="changeTab(settingsTabs.AdminSettings)"
        (keydown.enter)="changeTab(settingsTabs.AdminSettings)">
        <span class="text">Admin Settings</span>
        <span class="icon"><i class="pi pi-chevron-right"></i></span>
      </div>
    </div>
    <div class="content_right">
      @if (currentTab === settingsTabs.Dashboard) {
        <grn-card title="Dashboard Settings" class="card">
          <div class="card_content">
            <p>Admin settings works!</p>
          </div>
        </grn-card>
      } @else if (currentTab === settingsTabs.Watchdog) {
        <grn-card title="Watchdog Settings" class="card">
          <div class="card_content">
            <p>Watchdog settings work</p>
          </div>
        </grn-card>
      } @else if (currentTab === settingsTabs.AdminSettings) {
        <grn-card title="Admin Settings" class="card">
          <div class="card_content">
            <div class="otp">
              <span class="otp_input">
                <input
                  id="otpUsername"
                  type="text"
                  pInputText
                  [(ngModel)]="otpUsername" />
                <button pButton type="button" (click)="RequestOtp()">
                  <span class="button_label">Request otp</span>
                </button> </span
              ><span class="otp_output">
                <p-input-group>
                  <input id="otp" type="text" pInputText [(ngModel)]="otp" />
                  <button
                    pButton
                    type="button"
                    iconOnly
                    (click)="copyToClipboard()"
                    [severity]="!isCopied() ? 'warn' : 'primary'">
                    <i class="pi pi-clipboard"></i>
                  </button>
                </p-input-group>
              </span>
            </div>
          </div>
        </grn-card>
      }
    </div>
  </div>
</main>
