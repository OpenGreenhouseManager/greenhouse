<grn-nav-bar />
<main>
  <div class="heading">
    <h1>Alert</h1>
  </div>
  <div class="content">
    <p-select
      [options]="intervals"
      [(ngModel)]="selectedInterval"
      optionLabel="label" />
    <p-table
      #dt2
      [value]="alerts()"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [paginator]="true"
      [globalFilterFields]="[
        'identifier',
        'source',
        'first',
        'last',
        'severity',
      ]"
      [customSort]="true"
      (sortFunction)="customSort($event)"
      [tableStyle]="{ width: '100%', height: '100%' }">
      <ng-template #header>
        <tr>
          <th pSortableColumn="count" style="width: 5rem">Count</th>
          <th pSortableColumn="identifier" style="width: 20rem">
            <div class="flex justify-between items-center">
              Identifier
              <p-sort-icon field="identifier" />
              <p-column-filter
                type="text"
                field="identifier"
                display="menu"
                class="ml-auto" />
            </div>
          </th>
          <th pSortableColumn="source" style="width: 20rem">
            <div class="flex justify-between items-center">
              Source
              <p-sort-icon field="source" />
              <p-column-filter
                type="text"
                field="source"
                display="menu"
                class="ml-auto" />
            </div>
          </th>
          <th pSortableColumn="first" style="width: 20rem">
            <div class="flex justify-between items-center">
              First
              <p-sort-icon field="first" />
              <p-column-filter
                type="date"
                field="first"
                display="menu"
                class="ml-auto" />
            </div>
          </th>
          <th pSortableColumn="last" style="width: 20rem">
            <div class="flex justify-between items-center">
              Last
              <p-sort-icon field="last" />
              <p-column-filter
                type="date"
                field="last"
                display="menu"
                class="ml-auto" />
            </div>
          </th>
          <th pSortableColumn="severity" style="width: 15rem">
            <div class="flex justify-between items-center">
              Severity
              <p-sort-icon field="severity" />
              <p-column-filter
                field="severity"
                matchMode="equals"
                display="menu"
                class="ml-auto">
                <ng-template #filter let-value let-filter="filterCallback">
                  <p-select
                    [(ngModel)]="selectedSeverity"
                    [options]="severityOptions"
                    (onChange)="filter($event.value)"
                    placeholder="Select Severity"
                    [showClear]="true">
                    <ng-template let-option #item>
                      <grn-severity-tag [severity]="option.value" />
                    </ng-template>
                  </p-select>
                </ng-template>
              </p-column-filter>
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-item>
        <tr (click)="showDetails(item)">
          <td>
            {{ item.count }}
          </td>
          <td>
            {{ item.identifier }}
          </td>
          <td>
            <div class="tableCell">
              <span>{{ display(item.source) }}</span>
              <button
                pButton
                type="button"
                variant="text"
                (click)="editAlias($event, item.source)">
                <i class="pi pi-pencil"></i>Alias
              </button>
            </div>
          </td>
          <td>
            {{ prettyDate(item.first) }}
          </td>
          <td>
            {{ prettyDate(item.last) }}
          </td>
          <td>
            <grn-severity-tag [severity]="item.severity" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="6">No alerts found.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</main>
