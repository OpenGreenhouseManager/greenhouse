name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  typos:
    name: Typo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: typos

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly rustfmt
        run: |
          rustup update nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check --color always

  sort:
    name: Dependency Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Check dependency sort
        run: cargo sort --workspace --grouped --check

  rust-checks:
    name: Build / Clippy / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly components
        run: |
          rustup update nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rust-src clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Test
        run: cargo test --release --workspace --all-features -- --test-threads=1

  # greenhouse_esp32 is excluded from the workspace (own stable toolchain and
  # riscv target), so nothing above builds it. This is also the real check that
  # the greenhouse_core DTO / smart_device_common modules stay no_std.
  esp32:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/greenhouse_esp32
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/greenhouse_esp32
      - name: Format
        run: cargo fmt -- --check --color always
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build example firmware
        run: cargo build --release --example input_output_int_saver

  ts-bindings:
    name: TypeScript DTOs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly
        run: rustup update nightly
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check generated TypeScript DTOs
        run: just check-ts

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit
