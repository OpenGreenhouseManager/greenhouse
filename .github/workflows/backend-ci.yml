name: Backend CI

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  typos:
    name: Typo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: typos

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all -- --check --color always

  sort:
    name: Dependency Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Check dependency sort
        run: cargo sort --workspace --grouped --check

  rust-checks:
    name: Build / Clippy / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Test
        run: cargo test --release --workspace --all-features -- --test-threads=1

  # The jobs above build greenhouse_device for the host only; this builds its
  # ESP32 half (riscv32imc-unknown-none-elf, `esp32-*` aliases in
  # backend/.cargo/config.toml). It is also the check that greenhouse_core's DTO
  # modules stay no_std. Unit tests cannot build for a bare-metal target, hence
  # `--lib --examples` instead of `--all-targets`.
  esp32:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: esp32
      - name: Clippy
        run: cargo esp32-clippy --lib --examples -- -D warnings
      - name: Build example firmware
        run: cargo esp32-build --example esp32_input_output_int_saver

  ts-bindings:
    name: TypeScript DTOs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Check generated TypeScript DTOs
        run: just check-ts

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        run: cargo audit
