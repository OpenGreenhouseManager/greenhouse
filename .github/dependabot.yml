version: 2
updates:
  - package-ecosystem: cargo
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    groups:
      dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    groups:
      dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
